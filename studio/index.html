<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сөйле Студия — запись голоса</title>
<meta name="theme-color" content="#EF4C82">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7F3;--surface:#fff;--surface-2:#F6EEF0;--ink:#2A1F24;--dim:#7B6B72;--line:#EEDFE4;--accent:#EF4C82;--accent-ink:#fff;--ok:#1E9E6A;--warn:#D97706;--danger:#D64545}
@media (prefers-color-scheme: dark){:root{--bg:#181215;--surface:#221A1E;--surface-2:#2B2126;--ink:#F5EAEE;--dim:#B9A6AE;--line:#3A2D33;--accent:#FF77A6;--accent-ink:#2A0C17;--ok:#43C98E;--warn:#F5A524;--danger:#F07070}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:600 15px/1.45 Nunito,system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:900}
header h1{font-size:18px;margin:0;font-weight:900;flex:1}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:38px;padding:0 12px;font-weight:800;font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{border:0;background:transparent;border-radius:10px;height:38px;font-weight:800;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.progress{display:flex;align-items:center;gap:10px;margin:6px 2px 14px;font-size:13px;color:var(--dim)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;position:relative}
.pic{width:120px;height:120px;border-radius:18px;object-fit:cover;margin:4px auto 10px;display:block;background:var(--surface-2)}
.pic.empty{display:grid;place-items:center;font-size:42px}
.lang{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.06em;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:var(--dim)}
.word{font-size:40px;font-weight:900;line-height:1.15;margin:10px 0 6px;word-break:break-word}
.hint{font-size:14px;color:var(--dim);min-height:20px}
.num{position:absolute;top:14px;right:16px;font-size:12px;color:var(--dim)}
.done-badge{position:absolute;top:12px;left:14px;font-size:12px;font-weight:900;color:var(--ok)}
.rec{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:18px auto 6px;box-shadow:0 10px 24px -8px var(--accent);transition:transform .1s}
.rec:active{transform:scale(.96)}
.rec svg{width:40px;height:40px}
.rec.on{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(214,69,69,.15)}}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;max-width:220px;margin:8px auto 0}.meter i{display:block;height:100%;width:0;background:var(--ok)}
.status{font-size:13.5px;color:var(--dim);margin-top:8px;min-height:20px}
.status.bad{color:var(--danger)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:14px;height:46px;padding:0 18px;font-weight:900;font-size:15px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--ok);color:#fff}
.btn.small{height:36px;font-size:13px;padding:0 12px;border-radius:11px}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.list{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}.li.cur{background:var(--surface-2)}
.li .t{flex:1}.li .ok{color:var(--ok);font-weight:900}.li .no{color:var(--line)}
.li small{color:var(--dim);display:block;font-size:12px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.foot .btn{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:9;padding:0}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:20px 18px max(18px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:20px;font-weight:900}
.sheet ol{padding-left:20px;margin:8px 0}.sheet li{margin:6px 0}
.input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:800 20px Nunito,sans-serif;padding:0 12px}
.fixed-tag{display:inline-block;margin-top:6px;font-size:12px;color:var(--warn);font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">С</div><h1>Сөйле Студия</h1><button class="ibtn" id="help-btn">Как записывать</button></header>
  <div class="seg" id="stage-seg"></div>
  <div class="seg" id="lang-seg"></div>
  <div class="progress"><span id="prog-text"></span><div class="bar"><i id="prog-bar"></i></div></div>
  <div class="card" id="card"></div>
  <div class="nav"><button class="btn small" id="prev">← Назад</button><button class="btn small" id="skip-next">Следующее непрочитанное →</button></div>
  <div class="list" id="list"></div>
</div>
<div class="foot"><div class="in"><button class="btn" id="export">📦 Скачать архив этапа</button><button class="btn" id="share" hidden>Отправить</button></div></div>
<div id="modal-root"></div>

<script src="items.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  var ITEMS = window.STUDIO_ITEMS || [];
  var STAGES = [1,2,3];
  var LANGS = [['kk','Қазақша'],['ru','Русский']];
  function ls(k,d){ try{ var v=localStorage.getItem('studio_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
  function lsSet(k,v){ try{ localStorage.setItem('studio_'+k, JSON.stringify(v)); }catch(e){} }
  var st = { stage: ls('stage',1), lang: ls('lang','kk'), idx: 0, done: {}, fixes: ls('fixes',{}), recording:false };

  // ---------- IndexedDB ----------
  var db;
  function openDB(){ return new Promise(function(res,rej){ var r=indexedDB.open('soile_studio',1); r.onupgradeneeded=function(){ r.result.createObjectStore('rec'); }; r.onsuccess=function(){ db=r.result; res(); }; r.onerror=function(){ rej(r.error); }; }); }
  function put(k,v){ return new Promise(function(res,rej){ var tx=db.transaction('rec','readwrite'); tx.objectStore('rec').put(v,k); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }
  function get(k){ return new Promise(function(res){ var tx=db.transaction('rec','readonly'); var q=tx.objectStore('rec').get(k); q.onsuccess=function(){res(q.result);}; q.onerror=function(){res(null);}; }); }
  function allKeys(){ return new Promise(function(res){ var tx=db.transaction('rec','readonly'); var q=tx.objectStore('rec').getAllKeys(); q.onsuccess=function(){res(q.result||[]);}; q.onerror=function(){res([]);}; }); }

  function list(){ return ITEMS.filter(function(i){ return i.s===st.stage && i.l===st.lang; }); }
  function cur(){ return list()[st.idx]; }
  function textOf(i){ return st.fixes[i.k] || i.t; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function photoOf(i){ var c=(window.STUDIO_PHOTOS||{})[i.c]; return c ? '../'+c : ''; }

  // ---------- audio ----------
  var stream, recorder, chunks=[], ac, analyser, raf, lastUrl;
  function getAC(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); return ac; }
  async function startRec(){
    try{
      if(!stream) stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}});
    }catch(e){ setStatus('Нет доступа к микрофону — разрешите его в настройках браузера.', true); return; }
    chunks=[]; recorder=new MediaRecorder(stream);
    recorder.ondataavailable=function(e){ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop=onStop;
    recorder.start();
    st.recording=true; renderRecBtn(); setStatus('Говорите… нажмите ещё раз, когда закончите');
    var a=getAC(); if(a.state==='suspended') a.resume();
    var src=a.createMediaStreamSource(stream); analyser=a.createAnalyser(); analyser.fftSize=512; src.connect(analyser);
    var buf=new Uint8Array(analyser.fftSize);
    (function tick(){ analyser.getByteTimeDomainData(buf); var m=0; for(var i=0;i<buf.length;i++){ var v=Math.abs(buf[i]-128)/128; if(v>m)m=v; } var el=document.getElementById('meter-i'); if(el) el.style.width=Math.min(100,m*140)+'%'; raf=requestAnimationFrame(tick); })();
  }
  function stopRec(){ if(recorder && recorder.state!=='inactive') recorder.stop(); st.recording=false; cancelAnimationFrame(raf); renderRecBtn(); setStatus('Обрабатываю…'); }
  async function onStop(){
    try{
      var blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      var arr=await blob.arrayBuffer();
      var audio=await new Promise(function(res,rej){ getAC().decodeAudioData(arr,res,rej); });
      var out=trim(audio);
      if(!out){ setStatus('Ничего не слышно — скажите громче или ближе к телефону и запишите заново.', true); return; }
      var wav=encodeWav(out.data, out.rate);
      var it=cur();
      await put(it.k,{wav:wav,text:textOf(it),ts:Date.now(),dur:out.data.length/out.rate});
      st.done[it.k]=1;
      play(wav);
      var msg = out.quiet ? 'Тихо получилось — лучше перезаписать чуть громче.' : out.clip ? 'Слишком громко, звук хрипит — отодвиньте телефон.' : 'Готово ✓ Если всё хорошо — «Дальше».';
      setStatus(msg, out.quiet||out.clip);
      render(true);
    }catch(e){ console.error(e); setStatus('Не получилось обработать запись — попробуйте ещё раз.', true); }
  }
  function trim(audio){
    var rate=audio.sampleRate, ch=audio.getChannelData(0), n=ch.length;
    if(audio.numberOfChannels>1){ var c2=audio.getChannelData(1); var mix=new Float32Array(n); for(var i=0;i<n;i++) mix[i]=(ch[i]+c2[i])/2; ch=mix; }
    var win=Math.floor(rate*0.01), peak=0, rms=[];
    for(var s=0;s<n;s+=win){ var sum=0,e=Math.min(n,s+win); for(var j=s;j<e;j++){ sum+=ch[j]*ch[j]; var a=Math.abs(ch[j]); if(a>peak)peak=a; } rms.push(Math.sqrt(sum/(e-s))); }
    if(peak<0.01) return null;
    var maxR=Math.max.apply(null,rms), thr=Math.max(0.008, maxR*0.12), first=-1, last=-1;
    for(var k=0;k<rms.length;k++){ if(rms[k]>thr){ if(first<0)first=k; last=k; } }
    if(first<0) return null;
    var startS=Math.max(0,(first-6)*win), endS=Math.min(n,(last+14)*win);
    var seg=ch.slice(startS,endS), gain=Math.min(4, 0.9/peak), fade=Math.floor(rate*0.012);
    for(var q=0;q<seg.length;q++){ var g=gain; if(q<fade) g*=q/fade; if(seg.length-q<fade) g*=(seg.length-q)/fade; seg[q]=Math.max(-1,Math.min(1,seg[q]*g)); }
    // downsample to 22050 for smaller files
    var target=22050, ratio=rate/target, outLen=Math.floor(seg.length/ratio), out=new Float32Array(outLen);
    for(var t=0;t<outLen;t++){ var x=t*ratio, i0=Math.floor(x), f=x-i0; out[t]=seg[i0]*(1-f)+(seg[i0+1]||0)*f; }
    return {data:out, rate:target, quiet:peak<0.06, clip:peak>0.995};
  }
  function encodeWav(data,rate){
    var buf=new ArrayBuffer(44+data.length*2), v=new DataView(buf);
    function w(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); }
    w(0,'RIFF'); v.setUint32(4,36+data.length*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,data.length*2,true);
    for(var i=0;i<data.length;i++){ var s=Math.max(-1,Math.min(1,data[i])); v.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }
    return new Blob([buf],{type:'audio/wav'});
  }
  function play(blob){ try{ if(lastUrl) URL.revokeObjectURL(lastUrl); lastUrl=URL.createObjectURL(blob); var a=new Audio(lastUrl); a.play(); }catch(e){} }

  // ---------- UI ----------
  function setStatus(t,bad){ var el=document.getElementById('status'); if(el){ el.textContent=t; el.className='status'+(bad?' bad':''); } }
  function renderRecBtn(){ var b=document.getElementById('rec'); if(!b) return; b.classList.toggle('on',st.recording); b.innerHTML = st.recording ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'; }
  function render(keepStatus){
    var L=list(); if(st.idx>=L.length) st.idx=Math.max(0,L.length-1);
    var it=L[st.idx];
    document.getElementById('stage-seg').innerHTML = STAGES.map(function(s){ var n=ITEMS.filter(function(i){return i.s===s;}).length, d=ITEMS.filter(function(i){return i.s===s && st.done[i.k];}).length; return '<button data-stage="'+s+'" class="'+(st.stage===s?'on':'')+'">Этап '+s+' · '+d+'/'+n+'</button>'; }).join('');
    document.getElementById('lang-seg').innerHTML = LANGS.map(function(l){ return '<button data-lang="'+l[0]+'" class="'+(st.lang===l[0]?'on':'')+'">'+l[1]+'</button>'; }).join('');
    var dn=L.filter(function(i){return st.done[i.k];}).length;
    document.getElementById('prog-text').textContent = dn+' из '+L.length;
    document.getElementById('prog-bar').style.width = (L.length? dn/L.length*100:0)+'%';
    if(!it){ document.getElementById('card').innerHTML='<p>Пусто</p>'; return; }
    var ph=photoOf(it), isDone=!!st.done[it.k], status=keepStatus ? (document.getElementById('status')||{}).textContent||'' : (isDone?'Уже записано — можно прослушать или перезаписать.':'Нажмите кнопку и скажите слово');
    document.getElementById('card').innerHTML =
      (isDone?'<span class="done-badge">✓ записано</span>':'') + '<span class="num">'+(st.idx+1)+' / '+L.length+'</span>' +
      (ph ? '<img class="pic" src="'+esc(ph)+'" alt="">' : '<div class="pic empty">'+(it.l==='kk'?'🇰🇿':'💬')+'</div>') +
      '<span class="lang">'+(it.l==='kk'?'ҚАЗАҚША':'РУССКИЙ')+'</span>' +
      '<div class="word">'+esc(textOf(it))+'</div>' +
      '<div class="hint">'+esc(it.h||'')+'</div>' + (st.fixes[it.k]?'<span class="fixed-tag">исправлено (было: '+esc(it.t)+')</span>':'') +
      '<button class="rec" id="rec" aria-label="Записать"></button><div class="meter"><i id="meter-i"></i></div>' +
      '<div class="status" id="status">'+esc(status)+'</div>' +
      '<div class="row">' + (isDone?'<button class="btn small" id="listen">▶ Прослушать</button>':'') + '<button class="btn small" id="fix">✎ Исправить текст</button></div>' +
      '<div class="row"><button class="btn primary" id="next" '+(isDone?'':'style="opacity:.5"')+'>Дальше →</button></div>';
    renderRecBtn();
    var start=Math.max(0,st.idx-3), end=Math.min(L.length,st.idx+12);
    document.getElementById('list').innerHTML = L.slice(start,end).map(function(i,k){ var n=start+k; return '<div class="li '+(n===st.idx?'cur':'')+'" data-jump="'+n+'"><span class="'+(st.done[i.k]?'ok':'no')+'">'+(st.done[i.k]?'✓':'●')+'</span><span class="t">'+esc(textOf(i))+'<small>'+esc(i.h||'')+'</small></span><span style="color:var(--dim);font-size:12px">'+(n+1)+'</span></div>'; }).join('');
    lsSet('pos_'+st.stage+'_'+st.lang, st.idx); lsSet('stage',st.stage); lsSet('lang',st.lang);
  }
  function go(i){ if(st.recording) return; st.idx=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  function nextUndone(){ var L=list(); for(var k=1;k<=L.length;k++){ var i=(st.idx+k)%L.length; if(!st.done[L[i].k]) return go(i); } setStatus('В этом разделе всё записано 🎉 Скачайте архив этапа.'); }

  document.addEventListener('click', async function(e){
    var t=e.target.closest('button,[data-jump]'); if(!t) return;
    if(t.dataset.stage){ st.stage=+t.dataset.stage; st.idx=ls('pos_'+st.stage+'_'+st.lang,0); return render(); }
    if(t.dataset.lang){ st.lang=t.dataset.lang; st.idx=ls('pos_'+st.stage+'_'+st.lang,0); return render(); }
    if(t.dataset.jump){ return go(+t.dataset.jump); }
    if(t.id==='rec'){ return st.recording ? stopRec() : startRec(); }
    if(t.id==='next'){ var L=list(); if(st.idx<L.length-1) go(st.idx+1); else nextUndone(); return; }
    if(t.id==='prev'){ if(st.idx>0) go(st.idx-1); return; }
    if(t.id==='skip-next'){ return nextUndone(); }
    if(t.id==='listen'){ var r=await get(cur().k); if(r) play(r.wav); return; }
    if(t.id==='fix'){ return openFix(); }
    if(t.id==='help-btn'){ return openHelp(); }
    if(t.id==='export'){ return exportStage(false); }
    if(t.id==='share'){ return exportStage(true); }
    if(t.id==='close-modal'){ document.getElementById('modal-root').innerHTML=''; return; }
    if(t.id==='save-fix'){ var v=document.getElementById('fix-input').value.trim(), it=cur(); if(v && v!==it.t) st.fixes[it.k]=v; else delete st.fixes[it.k]; lsSet('fixes',st.fixes); document.getElementById('modal-root').innerHTML=''; return render(); }
  });
  document.getElementById('modal-root').addEventListener('click',function(e){ if(e.target.classList.contains('modal')) e.currentTarget.innerHTML=''; });

  function openFix(){
    var it=cur();
    document.getElementById('modal-root').innerHTML='<div class="modal"><div class="sheet"><h2>Исправить текст</h2><p style="color:var(--dim);margin:0 0 10px">Если слово или окончание написано неправильно — напишите как правильно и запишите уже его. Я поправлю в приложении.</p><input class="input" id="fix-input" value="'+esc(textOf(it))+'"><div class="row"><button class="btn" id="close-modal">Отмена</button><button class="btn primary" id="save-fix">Сохранить</button></div></div></div>';
    var i=document.getElementById('fix-input'); i.focus(); i.select();
  }
  function openHelp(){
    document.getElementById('modal-root').innerHTML='<div class="modal"><div class="sheet"><h2>Как записывать</h2><ol>'+
      '<li><b>Тихая комната</b>: без телевизора, кондиционера, детей рядом. Окна закрыты.</li>'+
      '<li>Телефон в руке на расстоянии <b>15–20 см</b> ото рта, всегда одинаково.</li>'+
      '<li>Нажмите красную кнопку, <b>подождите полсекунды</b>, скажите слово, нажмите ещё раз. Тишину по краям приложение обрежет само.</li>'+
      '<li>Говорите <b>спокойно, тепло и чётко</b>, как будто показываете ребёнку карточку. Без вопросительной интонации, на одном уровне громкости.</li>'+
      '<li>Слова-формы («ішемін», «воду») — говорите <b>так же ровно</b>, как отдельное слово: приложение будет склеивать их во фразы.</li>'+
      '<li>Ошиблись — просто нажмите кнопку ещё раз и перезапишите.</li>'+
      '<li>Если слово написано с ошибкой — «✎ Исправить текст».</li>'+
      '<li>Всё сохраняется в телефоне — можно закрыть и продолжить позже. Не очищайте историю браузера, пока не отправили архив!</li>'+
      '<li>Закончили этап — «📦 Скачать архив этапа» и отправьте файл Куанышу.</li>'+
      '</ol><div class="row"><button class="btn primary" id="close-modal">Понятно</button></div></div></div>';
  }
  async function exportStage(share){
    var L=ITEMS.filter(function(i){return i.s===st.stage;}), zip=new JSZip(), n=0, missing=0;
    for(var k=0;k<L.length;k++){ var r=await get(L[k].k); if(r){ zip.file(L[k].k+'.wav', r.wav); n++; } else missing++; }
    zip.file('fixes.json', JSON.stringify(st.fixes,null,1));
    zip.file('info.json', JSON.stringify({stage:st.stage, recorded:n, missing:missing, exported:new Date().toISOString(), ua:navigator.userAgent},null,1));
    if(!n){ setStatus('В этом этапе ещё нет записей.', true); return; }
    setStatus('Собираю архив…');
    var blob=await zip.generateAsync({type:'blob'});
    var name='soile-voice-stage'+st.stage+'-'+n+'.zip';
    var file=null; try{ file=new File([blob],name,{type:'application/zip'}); }catch(e){}
    if(share && file && navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); setStatus('Отправлено ✓'); return; }catch(e){} }
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000);
    setStatus('Архив готов: '+name+(missing?' (не записано ещё '+missing+')':''));
  }

  openDB().then(allKeys).then(function(keys){
    keys.forEach(function(k){ st.done[k]=1; });
    st.idx=ls('pos_'+st.stage+'_'+st.lang,0);
    try{ if(navigator.canShare && navigator.canShare({files:[new File(['x'],'a.zip',{type:'application/zip'})]})) document.getElementById('share').hidden=false; }catch(e){}
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
    render();
    if(!ls('seen_help',false)){ lsSet('seen_help',true); openHelp(); }
  }).catch(function(){ document.getElementById('card').innerHTML='<p>Браузер не даёт сохранять записи. Откройте страницу в Chrome или Safari (не в режиме инкогнито).</p>'; });
})();
</script>
